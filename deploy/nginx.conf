# Replace every tune.example.com with your domain. Obtain the certificate first;
# see docs/ubuntu.md. Install as /etc/nginx/sites-available/miweb.
server {
    listen 80;
    listen [::]:80;
    server_name tune.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tune.example.com;

    ssl_certificate /etc/letsencrypt/live/tune.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tune.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:miweb_ssl:10m;
    ssl_session_timeout 1d;

    client_max_body_size 36m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
